name: Build e deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Configura Firebase dal secret FIREBASE_APPLET_CONFIG
        env:
          FIREBASE_APPLET_CONFIG: ${{ secrets.FIREBASE_APPLET_CONFIG }}
        run: |
          if [ -z "$FIREBASE_APPLET_CONFIG" ]; then
            echo "::error::Secret FIREBASE_APPLET_CONFIG mancante: incolla il contenuto di firebase-applet-config.json in Settings > Secrets and variables > Actions."
            exit 1
          fi
          printf '%s' "$FIREBASE_APPLET_CONFIG" > firebase-applet-config.json
          jq -e . firebase-applet-config.json > /dev/null || { echo "::error::FIREBASE_APPLET_CONFIG non è un JSON valido."; exit 1; }
          jq -r '
            "VITE_FIREBASE_API_KEY=\(.apiKey // "")",
            "VITE_FIREBASE_AUTH_DOMAIN=\(.authDomain // "")",
            "VITE_FIREBASE_PROJECT_ID=\(.projectId // "")",
            "VITE_FIREBASE_STORAGE_BUCKET=\(.storageBucket // "")",
            "VITE_FIREBASE_MESSAGING_SENDER_ID=\(.messagingSenderId // "")",
            "VITE_FIREBASE_APP_ID=\(.appId // "")",
            "VITE_FIREBASE_MEASUREMENT_ID=\(.measurementId // "")",
            "VITE_FIREBASE_FIRESTORE_DATABASE_ID=\(.firestoreDatabaseId // "")"
          ' firebase-applet-config.json > .env.local
          rm firebase-applet-config.json
      - name: Build
        run: npm run build
        env:
          # GitHub Pages serve il sito in https://<utente>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
          # Nessun backend su Pages: notifiche email disattivate
          VITE_NOTIFY_API_URL: ''
      - name: Fallback SPA (404.html)
        # Le rotte come /devices/123 non esistono come file: Pages serve 404.html, che carica l'app
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
